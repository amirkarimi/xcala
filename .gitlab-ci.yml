stages:
  - build
  - test
  - publish

variables:
  IMAGE_USER: ketab

xcala_play_build:
  image: hub.hamdocker.ir/library/docker:29.5.3
  script:
    - echo "$REGISTRY_PASSWORD" | docker login -u "$REGISTRY_USER" --password-stdin $REGISTRY
    - export IMAGE="registry.hamdocker.ir/ketab/xcala-play"
    - export IMAGE_TEST="registry.hamdocker.ir/ketab/xcala-play-test"
    - docker build --build-arg NEXUS_KEY -t $IMAGE:$CI_COMMIT_SHORT_SHA -t $IMAGE:$CI_COMMIT_REF_SLUG --target builder .
    - docker build --build-arg NEXUS_KEY -t $IMAGE_TEST:$CI_COMMIT_SHORT_SHA -t $IMAGE_TEST:$CI_COMMIT_REF_SLUG --target test .
    - docker push $IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $IMAGE:$CI_COMMIT_REF_SLUG
    - docker push $IMAGE_TEST:$CI_COMMIT_SHORT_SHA
    - docker push $IMAGE_TEST:$CI_COMMIT_REF_SLUG
  retry: 2
  stage: build

xcala_play_test:
  image: registry.hamdocker.ir/ketab/xcala-play-test:$CI_COMMIT_SHORT_SHA
  services:
    - name: mongo:4.4.19
      alias: mongo
  script:
    - cd /opt
    - sbt -Dci=true "testOnly * -- -Dtest.config=/opt/conf/docker-test.conf"
  retry: 2
  stage: test

xcala_play_publish:
  image: registry.hamdocker.ir/ketab/xcala-play:$CI_COMMIT_SHORT_SHA
  only:
    refs:
      - master
  script:
    - cd /opt
    - sbt -Dci=true publish
  retry: 2
  stage: publish
